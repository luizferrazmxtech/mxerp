# Sobe o MXERP completo: banco PostgreSQL, sistema, backup diário e busca do extrato do Inter.
#   docker compose up -d --build
name: mxerp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mxerp
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      POSTGRES_DB: mxerp
      TZ: America/Sao_Paulo
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mxerp -d mxerp"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: mxerp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mxerp:${DB_SENHA}@db:5432/mxerp?schema=public
    ports:
      - "${PORTA:-3000}:3000"
    volumes:
      # certificado A1 (.pfx) e arquivos da integração do Inter (.crt/.key): só leitura
      - ./certificados:/certificados:ro

  # cópia do banco todo dia às 12h30 e 19h30 na pasta backups; guarda 30 dias
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_SENHA}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup: ativo"
        while true; do
          h=$$(date +%H%M)
          if [ "$$h" = "1230" ] || [ "$$h" = "1930" ]; then
            f=/backups/mxerp-$$(date +%Y%m%d-%H%M).dump
            pg_dump -h db -U mxerp -d mxerp -Fc -f "$$f" && echo "backup: $$f"
            find /backups -name 'mxerp-*.dump' -mtime +30 -delete
            sleep 60
          fi
          sleep 30
        done

  # de hora em hora (8h às 20h): busca o extrato e os boletos do Banco Inter (ignorado se a integração não estiver
  # configurada ou com a busca automática desligada) e processa os contratos (gera as cobranças, manda boleto e lembrete)
  agendador:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      TZ: America/Sao_Paulo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          h=$$(date +%H)
          if [ -n "$$CRON_SECRET" ] && [ "$$h" -ge 8 ] && [ "$$h" -le 20 ]; then
            curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/inter/sincronizar; echo
            curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/contratos/processar; echo
            curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/dfe/sincronizar; echo
            curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/frete/sincronizar; echo
            curl -s -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/pagseguro/sincronizar; echo
          fi
          sleep 3600
        done

  # Central de revenda (só para testar no PC): ligue com windows\central.ps1 (põe COMPOSE_PROFILES=central no .env)
  # e abra http://localhost:3100. Na VPS a Central roda pelo vps/docker-compose.yml.
  central:
    profiles: ["central"]
    build: ./central
    image: mxerp-central
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mxerp:${DB_SENHA}@db:5432/central?schema=public
      CRON_SECRET: ${CRON_SECRET:-}
      CHAVE_SEGREDOS: ${CHAVE_SEGREDOS:-}
      TZ: America/Sao_Paulo
      # o MXERP deste PC aparece na Central como cliente da casa (sem cobrança), com os backups da pasta backups
      CLIENTE_ZERO_SLUG: mxerp
      CLIENTE_ZERO_DOMINIO: localhost:${PORTA:-3000}
      CLIENTE_ZERO_URL: http://app:3000
    ports:
      - "${PORTA_CENTRAL:-3100}:3000"
    volumes:
      - ./backups:/backups/mxerp:ro

volumes:
  dados:
